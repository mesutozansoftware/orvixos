# OrvixOS masaüstü (pcmanfm-qt --desktop --profile=orvixos)
[Behavior]
SingleClick=false
ConfirmDelete=true
ConfirmTrash=false
QuickExec=false

[Desktop]
BgColor=#0b1220
FgColor=#ffffff
ShadowColor=#000000
Wallpaper=/usr/share/backgrounds/trlde/orvixos.svg
WallpaperMode=zoom
WallpaperRandomize=false
PerScreenWallpaper=false
DesktopIconSize=48
DesktopShortcuts=Home, Trash, Computer
ShowHidden=false
SortColumn=name
SortOrder=ascending
SortFolderFirst=true
AllSticky=false

[System]
Terminal=xfce4-terminal
Archiver=file-roller
SIUnit=false

[Thumbnail]
ShowThumbnails=true
