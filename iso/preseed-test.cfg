# Yalnızca otomatik test ISO'su için: tüm soruları yanıtlar.
# Seri konsolda kurulum dili yalnızca İngilizce olabilir; sistem dili Türkçe.
d-i debian-installer/country string TR
d-i localechooser/supported-locales multiselect tr_TR.UTF-8
d-i time/zone string Europe/Istanbul
d-i keyboard-configuration/xkb-keymap select tr
d-i passwd/user-fullname string OrvixOS Test
d-i passwd/username string orvix
d-i passwd/user-password password orvixtest
d-i passwd/user-password-again password orvixtest
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true
d-i grub-installer/bootdev string default
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
