source /boot/grub/config.cfg

menuentry "OrvixOS'u dene veya kur" --hotkey=d {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}
menuentry "Try or install OrvixOS (English)" --hotkey=e {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=en_US.UTF-8 keyboard-layouts=us
	initrd	@INITRD_LIVE@
}
menuentry "OrvixOS - güvenli grafik kipi" --hotkey=g {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}
