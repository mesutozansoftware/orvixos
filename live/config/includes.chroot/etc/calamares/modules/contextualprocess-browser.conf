# Seçilen tarayıcıyı varsayılan yapar, diğerlerini hedef sistemden kaldırır.
---
dontChroot: false
timeout: 900
packagechooser_browser:
    vira:
        - command: "/usr/lib/orvixos/set-browser vira --purge-others"
    firefox:
        - command: "/usr/lib/orvixos/set-browser firefox --purge-others"
    chromium:
        - command: "/usr/lib/orvixos/set-browser chromium --purge-others"
