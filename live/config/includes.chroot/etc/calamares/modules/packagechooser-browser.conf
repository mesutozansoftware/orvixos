# Kurulumda tarayıcı seçimi. Seçim "packagechooser_browser" olarak
# saklanır; contextualprocess@browser seçilmeyenleri kaldırır.
---
mode: required
method: legacy
labels:
    step: "Web browser"
    step[tr]: "Web tarayıcısı"
default: vira
items:
    - id: vira
      name: "Vira Browser (recommended)"
      name[tr]: "Vira Browser (önerilen)"
      description: "Fast, privacy-focused browser with a built-in ad and tracker blocker (Vira Shields) and Secure Engine."
      description[tr]: "Yerleşik reklam ve izleyici engelleyici (Vira Shields) ve Secure Engine ile hızlı, gizlilik odaklı tarayıcı."
      screenshot: "/usr/share/icons/hicolor/256x256/apps/vira-browser.png"
    - id: firefox
      name: "Firefox ESR"
      description: "Mozilla's extended support release. Security updates arrive with vpx sync."
      description[tr]: "Mozilla'nın uzun süreli destek sürümü. Güvenlik güncellemeleri vpx sync ile gelir."
      screenshot: "/usr/share/icons/hicolor/128x128/apps/firefox-esr.png"
    - id: chromium
      name: "Chromium"
      description: "The open-source base of Chrome. Security updates arrive with vpx sync."
      description[tr]: "Chrome'un açık kaynak temeli. Güvenlik güncellemeleri vpx sync ile gelir."
      screenshot: "/usr/share/icons/hicolor/256x256/apps/chromium.png"
