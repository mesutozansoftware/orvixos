# OrvixOS disk bölümleme ayarları (Calamares).
#
# Varsayılan olarak bir takas dosyası (/swapfile) oluşturulur; boyutu RAM'e
# göre seçilir. Kurulumda "Takas yok", "Takas (uyku olmadan)" ya da
# "Takas (uyku/hazırda bekletme ile)" da seçilebilir.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 300MiB
    minimumSize: 32MiB
    label: "EFI"

userSwapChoices:
    - none
    - small
    - suspend
    - file
initialSwapChoice: file
swapPartitionName: "swap"

initialPartitioningChoice: erase
allowManualPartitioning: true
drawNestedPartitions: false
alwaysShowPartitionLabels: true
showNotEncryptedBootMessage: false

defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]

enableLuksAutomatedPartitioning: true
luksGeneration: luks2
