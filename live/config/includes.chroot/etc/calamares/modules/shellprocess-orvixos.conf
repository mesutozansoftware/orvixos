# Canlı sisteme özgü ayarları kurulu sistemden temizler.
---
dontChroot: false
timeout: 300
script:
    - "-rm -f /etc/sddm.conf.d/zz-orvixos-live.conf"
    - "-rm -f /etc/trlde/autostart.d/orvixos-live-installer"
    - "-rm -f /usr/bin/orvixos-install /usr/share/applications/orvixos-install.desktop"
    - "-rm -f /etc/sudoers.d/live"
    - "systemctl set-default graphical.target"
    # Tek tarayıcı Vira Browser; başka tarayıcı kalmışsa kaldırılır.
    - "-/usr/lib/orvixos/set-browser vira --purge-others"
