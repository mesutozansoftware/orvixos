---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false
doAutologin:     false
hostname:
    location: EtcFile
    template: "orvixos"
passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
        # Parola sözlüğü (cracklib) canlı sistemde yok; denetim kapalı.
        # Yoksa şifre ekranında "error loading dictionary" görünür.
        - dictcheck=0
