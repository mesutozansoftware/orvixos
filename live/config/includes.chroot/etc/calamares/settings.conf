# OrvixOS kurulum programı (Calamares) — canlı ISO
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: browser
  module: packagechooser
  config: packagechooser-browser.conf
- id: browser
  module: contextualprocess
  config: contextualprocess-browser.conf
- id: orvixos
  module: shellprocess
  config: shellprocess-orvixos.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - packagechooser@browser
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - contextualprocess@browser
  - shellprocess@orvixos
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount
- show:
  - finished

branding: orvixos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
